<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{LEO.DEV} - IT portfolio</title>
<meta name="description" content="Leo's IT portfolio: web development, game development, and AI prompting projects.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="grid-overlay" aria-hidden="true"></div>

<header class="site-header">
  <div class="wrap header-inner">
    <a href="#top" class="brand-mark" id="brand-mark">{LEO.DEV}</a>
    <nav class="main-nav" id="main-nav" aria-label="Primary"></nav>
    <a class="nav-cta" id="nav-cta" href="#contact"></a>
    <button class="nav-toggle" id="nav-toggle" aria-label="Toggle menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<main id="top">

  <section class="hero" id="hero">
    <div class="wrap hero-inner">
      <div class="hero-copy">
        <p class="status-tag" id="hero-status"></p>
        <h1><span id="hero-greeting"></span> <span class="accent" id="hero-name"></span></h1>
        <p class="hero-headline" id="hero-headline"></p>
        <p class="hero-subhead" id="hero-subhead"></p>
        <div class="hero-actions">
          <a class="btn btn-primary" id="hero-cta-primary" href="#work"></a>
          <a class="btn btn-ghost" id="hero-cta-secondary" href="#contact"></a>
        </div>
      </div>

      <div class="hero-visual">
        <div class="scan-frame">
          <img class="profile-photo" id="profile-photo" src="profile.jpg" alt="Leo" onerror="this.style.display='none'; document.getElementById('photo-placeholder').style.display='flex';">
          <div class="photo-placeholder" id="photo-placeholder">
            <span>+ Add profile.jpg<br>to this folder</span>
          </div>
          <span class="frame-tag frame-tag-tl">// LEO_v4</span>
          <span class="frame-tag frame-tag-br" id="frame-tag-status"></span>
        </div>
        <div class="hud-stack" id="hud-stack"></div>
      </div>
    </div>
  </section>

  <section class="about" id="about">
    <div class="wrap about-inner">
      <div class="about-copy">
        <p class="eyebrow" id="about-eyebrow"></p>
        <h2 id="about-heading"></h2>
        <p id="about-bio"></p>
      </div>
      <ul class="focus-list" id="focus-list"></ul>
    </div>
  </section>

  <section class="skills" id="skills">
    <div class="wrap">
      <div class="section-head">
        <h2 id="skills-heading"></h2>
        <p id="skills-intro"></p>
      </div>
      <div class="skills-groups" id="skills-groups"></div>
    </div>
  </section>

  <section class="work" id="work">
    <div class="wrap">
      <div class="section-head">
        <h2 id="work-heading"></h2>
        <p id="work-intro"></p>
      </div>
      <div class="work-grid" id="work-grid"></div>
    </div>
  </section>

  <section class="certificates" id="certificates">
    <div class="wrap">
      <div class="section-head">
        <h2 id="certificates-heading"></h2>
        <p id="certificates-intro"></p>
      </div>
      <div class="cert-grid" id="cert-grid"></div>
    </div>
  </section>

  <section class="contact" id="contact">
    <div class="wrap contact-inner">
      <div class="contact-copy">
        <h2 id="contact-heading"></h2>
        <p class="terminal-prompt" id="contact-prompt"></p>
        <p id="contact-intro"></p>
        <a class="contact-email" id="contact-email" href="#"></a>
      </div>
      <form class="contact-form" id="contact-form" novalidate>
        <div class="field">
          <label for="f-name" id="label-name"></label>
          <input type="text" id="f-name" name="name" required>
        </div>
        <div class="field">
          <label for="f-email" id="label-email"></label>
          <input type="email" id="f-email" name="email" required>
        </div>
        <div class="field">
          <label for="f-message" id="label-message"></label>
          <textarea id="f-message" name="message" rows="4" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary" id="form-submit"></button>
        <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
      </form>
    </div>
  </section>

</main>

<footer class="site-footer">
  <div class="wrap footer-inner">
    <div class="footer-credit">
      <span class="brand-mark small" id="footer-credit"></span>
      <span class="footer-handle" id="footer-handle"></span>
    </div>
    <ul class="footer-socials" id="footer-socials"></ul>
    <ul class="footer-legal" id="footer-legal"></ul>
    <p class="footer-note" id="footer-note"></p>
  </div>
</footer>

<script src="script.js"></script>
</body>
</html>
